server.port=8080

# Seed Data Toggle (set to false after first boot with PostgreSQL)
blabla.seeder.enabled=${BLABLA_SEEDER_ENABLED:true}

# PostgreSQL Database Configuration (reads from env vars, with local defaults)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/blabla_porter}
spring.datasource.username=${DATABASE_USERNAME:blabla}
spring.datasource.password=${DATABASE_PASSWORD:blabla_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Key (MUST be set via environment variable in production)
blabla.jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_this_is_only_a_dev_fallback_64chars!}

# Swagger OpenAPI UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Razorpay Test Mode Configurations
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Twilio SMS Configurations
blabla.sms.provider=${SMS_PROVIDER:MOCK}
blabla.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
blabla.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
blabla.twilio.phone-number=${TWILIO_PHONE_NUMBER:}


